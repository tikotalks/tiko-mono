name = "user-media-upload"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Custom domain for user media
routes = [
  { pattern = "https://user-media.tikocdn.org/*", zone_name = "tikocdn.org" }
]

[[r2_buckets]]
binding = "USER_MEDIA_BUCKET"
bucket_name = "user-media"

[[d1_databases]]
binding = "USER_MEDIA_DB"
database_name = "tiko-db"
database_id = "f99b61ae-6a78-4670-bb9c-cdc4f634264a"

[env.development]
name = "user-media-upload-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.r2_buckets]]
binding = "USER_MEDIA_BUCKET"
bucket_name = "user-media-dev"

[[env.development.d1_databases]]
binding = "USER_MEDIA_DB"
database_name = "tiko-db"
database_id = "f99b61ae-6a78-4670-bb9c-cdc4f634264a"
