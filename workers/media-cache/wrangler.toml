name = "media-cache"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]
account_id = "dc2b7d14a69351375cab6de9a13ddee9"

routes = [
  { pattern = "media.tikoapi.org/*", zone_name = "tikoapi.org" }
]

kv_namespaces = [
  { binding = "MEDIA_CACHE", id = "a26659698dbb44c48de3d06e100e5c78", preview_id = "a26659698dbb44c48de3d06e100e5c78" }
]

[[d1_databases]]
binding = "MEDIA_DB"
database_name = "tiko-media"
database_id = "f984707d-04a1-4266-bf9d-012164ccde85"

# Environment variables:
# DEPLOYMENT_VERSION (optional, defaults to date)

[env.staging]
name = "media-cache-staging"
kv_namespaces = [
  { binding = "MEDIA_CACHE", id = "da4fddfde76b49b189c859bcd3292975" }
]
routes = [
  { pattern = "staging-tikoapi.org/media/cache", zone_name = "tikoapi.org" }
]

[[env.staging.d1_databases]]
binding = "MEDIA_DB"
database_name = "tiko-media"
database_id = "f984707d-04a1-4266-bf9d-012164ccde85"

[env.production]
name = "media-cache"
kv_namespaces = [
  { binding = "MEDIA_CACHE", id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID" }
]
routes = [
  { pattern = "tikoapi.org/media/cache", zone_name = "tikoapi.org" }
]

[[env.production.d1_databases]]
binding = "MEDIA_DB"
database_name = "tiko-media"
database_id = "f984707d-04a1-4266-bf9d-012164ccde85"
