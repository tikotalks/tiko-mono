#:schema node_modules/wrangler/config-schema.json
name = "assets-upload"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Production routes - will be deployed to assets.tikoapi.org
# routes = [
#   { pattern = "assets.tikoapi.org/*", zone_name = "tikoapi.org" }
# ]

[[r2_buckets]]
binding = "ASSETS_R2_BUCKET"
bucket_name = "tiko-assets"

[[d1_databases]]
binding = "ASSETS_DB"
database_name = "tiko-assets"
database_id = "4287b238-934f-4dd8-8559-7facb9ff39ef"

[env.development]
name = "assets-upload-dev"
routes = []
workers_dev = true

[[env.development.r2_buckets]]
binding = "ASSETS_R2_BUCKET"
bucket_name = "tiko-assets-dev"

[[env.development.d1_databases]]
binding = "ASSETS_DB"
database_name = "tiko-assets-dev"
database_id = "85e07dfc-d7d5-4b95-9489-268a50a95f3a"
