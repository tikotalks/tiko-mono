name = "user-removal"
main = "src/index.ts"
compatibility_date = "2023-12-01"

[[d1_databases]]
binding = "USER_REMOVAL_DB"
database_name = "tiko-auth"
database_id = "dd37ed38-751c-46c4-866d-73294974e33b"

[env.production]
route = { pattern = "tikoapi.org/user-removal/*", zone_name = "tikoapi.org" }

[[env.production.kv_namespaces]]
binding = "USER_REMOVAL_LOG"
id = "your_kv_namespace_id"

[[env.production.d1_databases]]
binding = "USER_REMOVAL_DB"
database_name = "tiko-auth"
database_id = "dd37ed38-751c-46c4-866d-73294974e33b"

[vars]
ENVIRONMENT = "production"

# Secrets (set via wrangler secret put)
# ADMIN_API_KEY - Secret key for admin operations