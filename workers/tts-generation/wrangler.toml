name = "tts-generation"
main = "src/index.ts"
compatibility_date = "2024-12-14"

# Custom domain for TTS worker
routes = [
  { pattern = "https://tts.tikoapi.org/*", zone_name = "tikoapi.org" }
]

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "tiko-tts-audio"
preview_bucket_name = "tiko-tts-audio-preview"

[[d1_databases]]
binding = "TTS_DB"
database_name = "tiko-db"
database_id = "f99b61ae-6a78-4670-bb9c-cdc4f634264a"

[vars]
ENVIRONMENT = "production"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "tiko-tts-audio"
preview_bucket_name = "tiko-tts-audio-preview"

[[env.production.d1_databases]]
binding = "TTS_DB"
database_name = "tiko-db"
database_id = "f99b61ae-6a78-4670-bb9c-cdc4f634264a"

# Secrets to be set:
# OPENAI_API_KEY - OpenAI API key
