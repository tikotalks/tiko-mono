name = "tiko-content-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "dc2b7d14a69351375cab6de9a13ddee9"

routes = [
  { pattern = "content.tikoapi.org/*", zone_name = "tikoapi.org" },
  { pattern = "items.tikoapi.org/*", zone_name = "tikoapi.org" }
]

# Production route is now configured via custom domain in Cloudflare dashboard
# content.tikoapi.org -> tiko-content-api worker

[env.staging]
routes = [
  { pattern = "content-staging.tikoapi.org/*", zone_name = "tikoapi.org" }
]

# KV namespace for caching
[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "19e053c7a4c94f16a1ee4a436bfac34a"

[[d1_databases]]
binding = "CONTENT_DB"
database_name = "tiko-content"
database_id = "e3bd6a85-fd96-4666-8026-2b6592557be4"

[[env.staging.d1_databases]]
binding = "CONTENT_DB"
database_name = "tiko-content-staging"
database_id = "2412c370-9e7c-4991-9995-6eea10b38d90"

# Environment variables
[vars]
CACHE_TTL = "86400" # 24 hours in seconds

# Durable Objects for advanced caching (optional)
# [[durable_objects.bindings]]
# name = "CACHE_MANAGER"
# class_name = "CacheManager"

# R2 bucket for large content (optional)
# [[r2_buckets]]
# binding = "CONTENT_BUCKET"
# bucket_name = "tiko-content"