          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Install only the required packages for Sequence app build
          pnpm install --no-frozen-lockfile --filter=sequence...

      - name: Download translation files
        uses: actions/download-artifact@v4
        with:
          name: i18n-translations
          path: packages/core/src/i18n/generated/

      - name: Build Sequence app
        run: |
          pnpm --filter=@tiko/ui build
          pnpm --filter=@tiko/core build
          pnpm --filter=@tiko/animations build
          cd apps/sequence && pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TTS_WORKER_URL: ${{ secrets.VITE_TTS_WORKER_URL }}
          VITE_TTS_CDN_URL: ${{ secrets.VITE_TTS_CDN_URL }}
          VITE_SITE_URL: https://${{ needs.determine-environment.outputs.url-suffix }}sequence.tikoapps.org

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dc2b7d14a69351375cab6de9a13ddee9
          command: pages deploy ./apps/sequence/dist --project-name=tiko-sequence${{ needs.determine-environment.outputs.branch-suffix }} --commit-dirty=true --branch=${{ github.ref_name }}

  deploy-clock:
    needs: [determine-environment, check-triggers, check-environment, generate-translations]
    if: needs.check-triggers.outputs.build-clock == 'true'
    runs-on: ubuntu-latest
    name: Deploy Clock App (${{ needs.determine-environment.outputs.environment }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --filter=clock...

      - name: Download translation files
        uses: actions/download-artifact@v4
        with:
          name: i18n-translations
          path: packages/core/src/i18n/generated/

      - name: Build Clock app
        run: |
          pnpm --filter=@tiko/ui build
          pnpm --filter=@tiko/core build
          pnpm --filter=clock build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TTS_WORKER_URL: ${{ secrets.VITE_TTS_WORKER_URL }}
          VITE_TTS_CDN_URL: ${{ secrets.VITE_TTS_CDN_URL }}
          VITE_SITE_URL: https://${{ needs.determine-environment.outputs.url-suffix }}clock.tikoapps.org

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dc2b7d14a69351375cab6de9a13ddee9
          command: pages deploy ./apps/clock/dist --project-name=tiko-clock${{ needs.determine-environment.outputs.branch-suffix }} --commit-dirty=true --branch=${{ github.ref_name }}

  deploy-tiko:
    needs: [determine-environment, check-triggers, check-environment, generate-translations]
    if: needs.check-triggers.outputs.build-tiko == 'true'
    runs-on: ubuntu-latest
    name: Deploy Tiko Dashboard App (${{ needs.determine-environment.outputs.environment }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --filter=tiko...

      - name: Download translation files
        uses: actions/download-artifact@v4
        with:
          name: i18n-translations
          path: packages/core/src/i18n/generated/

      - name: Build Tiko dashboard app
        run: |
          pnpm --filter=@tiko/ui build
          pnpm --filter=@tiko/core build
          pnpm --filter=tiko build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TTS_WORKER_URL: ${{ secrets.VITE_TTS_WORKER_URL }}
          VITE_TTS_CDN_URL: ${{ secrets.VITE_TTS_CDN_URL }}
          VITE_SITE_URL: https://${{ needs.determine-environment.outputs.url-suffix }}tikoapps.org

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dc2b7d14a69351375cab6de9a13ddee9
          command: pages deploy ./apps/tiko/dist --project-name=tiko-dashboard${{ needs.determine-environment.outputs.branch-suffix }} --commit-dirty=true --branch=${{ github.ref_name }}
