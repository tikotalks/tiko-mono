name: Tiko Smoke Harness

on:
  pull_request:
    branches: [development, master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/smoke-harness exec playwright install --with-deps chromium
      - run: pnpm --dir tools/smoke-harness smoke timer todo
